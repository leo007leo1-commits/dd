<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WeWant SALE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a1a; --paper:#fafaf7; --paper2:#f1efe8; --red:#c30d22; --warm:#8a8578;
  --line:#e3e0d8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);overflow-x:hidden;
  font-family:'Noto Sans KR',sans-serif;-webkit-font-smoothing:antialiased;}
img{display:block;max-width:100%;}

/* ---------- header ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.topbar .logo{font-weight:900;font-size:18px;letter-spacing:.02em;}
.topbar .logo span{color:var(--red);}
.topbar .updated{font-size:11px;color:#b8b5ad;font-weight:400;}

.brandtabs{position:sticky;top:48px;z-index:19;background:var(--paper);
  display:flex;gap:0;overflow-x:auto;border-bottom:1.5px solid var(--ink);
  -webkit-overflow-scrolling:touch;}
.brandtabs::-webkit-scrollbar{display:none;}
.brandtab{flex:0 0 auto;padding:13px 18px;font-size:14px;font-weight:700;color:var(--warm);
  white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;background:none;border-top:none;border-left:none;border-right:none;
  font-family:inherit;}
.brandtab.active{color:var(--ink);border-bottom-color:var(--red);}

.cartbtn{position:relative;background:none;border:none;font-size:18px;color:#fff;cursor:pointer;
  padding:4px 2px;line-height:1;}
.cartbadge{position:absolute;top:-6px;right:-8px;background:var(--red);color:#fff;font-size:10px;
  font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;padding:0 3px;}
.cartbadge.zero{display:none;}

.filterrow{position:sticky;top:96px;z-index:18;background:var(--paper);display:flex;align-items:center;
  gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);}
.seasonpills{display:flex;gap:6px;overflow-x:auto;flex:1;-webkit-overflow-scrolling:touch;}
.seasonpills::-webkit-scrollbar{display:none;}
.seasonpill{flex:0 0 auto;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:20px;
  border:1px solid var(--line);background:var(--paper);color:var(--warm);cursor:pointer;white-space:nowrap;}
.seasonpill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.sortselect{flex:0 0 auto;font-size:12.5px;font-weight:500;padding:6px 8px;border-radius:8px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:inherit;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:12px 18px;border-radius:10px;
  z-index:100;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;max-width:88%;
  text-align:center;line-height:1.5;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.hero{padding:20px 16px 14px;}
.hero h1{font-size:21px;font-weight:900;margin:0 0 4px;line-height:1.3;}
.hero p{font-size:13px;color:var(--warm);margin:0;}
.hero .count{color:var(--red);font-weight:700;}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);}
@media (min-width:640px){ .grid{grid-template-columns:repeat(3,1fr);} }
@media (min-width:980px){ .grid{grid-template-columns:repeat(4,1fr);} }

.card{background:var(--paper);position:relative;display:flex;flex-direction:column;cursor:pointer;}
.card .photo{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;background:var(--paper2);flex-shrink:0;}
.card .photo img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
.card .badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;
  font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:3px;letter-spacing:.02em;}
.card .pct{position:absolute;top:8px;right:8px;background:var(--ink);color:#fff;
  font-size:11px;font-weight:900;padding:3px 7px;border-radius:3px;}
.card .photocount{position:absolute;bottom:8px;right:8px;background:rgba(20,18,14,.62);
  color:#fff;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:3px;
  display:flex;align-items:center;gap:3px;}
.card .photocount i{font-style:normal;font-size:11px;}
.card .body{padding:11px 12px 14px;}
.card .name{font-size:13px;font-weight:500;color:var(--ink);margin:0 0 6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card .priceline{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:5px;}
.card .old{font-size:12px;color:var(--warm);text-decoration:line-through;text-decoration-thickness:1px;}
.card .new{font-size:17px;font-weight:900;color:var(--red);}
.card .colors{font-size:11px;color:var(--warm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---------- detail modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,18,14,.55);z-index:50;
  display:none;align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
@media (min-width:640px){ .overlay.open{align-items:center;} }
.sheet{background:var(--paper);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;}
@media (min-width:640px){ .sheet{border-radius:14px;} }
.sheet .closebar{position:sticky;top:0;background:var(--paper);display:flex;justify-content:flex-end;
  padding:10px 12px 0;}
.sheet .closebar button{width:30px;height:30px;border-radius:50%;border:none;background:var(--paper2);
  font-size:16px;color:var(--ink);cursor:pointer;}
.sheet .dphoto{aspect-ratio:1;background:var(--paper2);overflow:hidden;margin:6px 16px 0;border-radius:8px;
  position:relative;}
.sheet .dphoto .slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;}
.sheet .dphoto .slides::-webkit-scrollbar{display:none;}
.sheet .dphoto .slide{flex:0 0 100%;scroll-snap-align:start;position:relative;}
.sheet .dphoto .slide img{width:100%;height:100%;object-fit:cover;}
.slidecolorlabel{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  background:#fff;color:#1a1a1a;font-size:13px;font-weight:700;
  padding:5px 14px;border-radius:4px;white-space:nowrap;pointer-events:none;
  border:1px solid #e3e0d8;}
.sheet .dphoto .navbtn{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;
  border-radius:50%;background:rgba(255,255,255,.85);border:none;font-size:16px;color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
.sheet .dphoto .navbtn.prev{left:8px;}
.sheet .dphoto .navbtn.next{right:8px;}
.sheet .dphoto .dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;
  gap:5px;z-index:2;}
.sheet .dphoto .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);}
.sheet .dphoto .dot.active{background:#fff;width:16px;border-radius:3px;}
.sheet .dbody{padding:16px 20px 28px;}
.sheet .dname{font-size:18px;font-weight:700;margin:0 0 8px;}
.sheet .dpriceline{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
.sheet .dold{font-size:15px;color:var(--warm);text-decoration:line-through;}
.sheet .dnew{font-size:25px;font-weight:900;color:var(--red);}
.sheet .specs{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px;}
.sheet .specrow{display:flex;font-size:13px;gap:14px;}
.sheet .speclabel{flex:0 0 64px;color:var(--warm);font-weight:500;padding-top:3px;}
.sheet .specval{flex:1;color:var(--ink);}
.sheet .colorchips{display:flex;flex-wrap:wrap;gap:6px;}
.sheet .colorchip{font-size:12px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);
  background:var(--paper2);color:var(--ink);}
.sheet .colorchip.out{color:var(--warm);text-decoration:line-through;opacity:.6;}
.sheet .desc{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
  font-size:13px;line-height:1.7;color:var(--ink);white-space:pre-line;}
.sheet .contactbtn{display:block;width:100%;margin-top:18px;padding:13px;text-align:center;
  background:var(--ink);color:#fff;font-weight:700;font-size:14px;border-radius:8px;
  text-decoration:none;}

.colorpick{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
.colorpickchip{font-size:13px;padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--ink);cursor:pointer;}
.colorpickchip.sel{border-color:var(--ink);background:var(--ink);color:#fff;}
.colorpickchip.disabled{color:var(--warm);text-decoration:line-through;opacity:.45;cursor:not-allowed;}

.qtyrow{display:flex;align-items:center;gap:14px;margin-top:14px;}
.qtystepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;}
.qtystepper button{width:34px;height:34px;border:none;background:none;font-size:16px;color:var(--ink);
  cursor:pointer;}
.qtystepper .qtyval{width:44px;text-align:center;font-size:14px;font-weight:500;border:none;
  background:none;color:var(--ink);font-family:inherit;-moz-appearance:textfield;}
.qtystepper .qtyval::-webkit-outer-spin-button,.qtystepper .qtyval::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0;}
.qtystock{font-size:12px;color:var(--warm);}

.addcartbtn{display:block;width:100%;margin-top:18px;padding:13px;text-align:center;
  background:var(--ink);color:#fff;font-weight:700;font-size:14px;border-radius:8px;
  border:none;cursor:pointer;}
.addcartbtn:disabled{background:var(--line);color:var(--warm);cursor:not-allowed;}

.cartsheet .dbody{padding:4px 16px 24px;}
.cartempty{padding:50px 20px;text-align:center;color:var(--warm);font-size:13.5px;}
.cartbrandgroup{margin-top:18px;}
.cartbrandhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cartbrandhead h3{font-size:14px;font-weight:700;margin:0;}
.cartline{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.cartline img{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--paper2);flex:0 0 56px;}
.cartline .info{flex:1;min-width:0;}
.cartline .iname{font-size:13px;font-weight:500;margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cartline .icolor{font-size:12px;color:var(--warm);margin:0 0 6px;}
.cartline .irow{display:flex;align-items:center;justify-content:space-between;}
.cartline .qtystepper button{width:26px;height:26px;font-size:14px;}
.cartline .removebtn{background:none;border:none;color:var(--warm);font-size:12px;cursor:pointer;
  text-decoration:underline;}
.orderbtn{display:block;width:100%;margin-top:10px;padding:11px;text-align:center;
  background:var(--red);color:#fff;font-weight:700;font-size:13.5px;border-radius:8px;border:none;
  cursor:pointer;}

.footer{padding:30px 16px 40px;text-align:center;font-size:11.5px;color:var(--warm);
  border-top:1px solid var(--line);margin-top:6px;}
.empty{padding:60px 16px;text-align:center;color:var(--warm);font-size:13px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">WE<span>WANT</span> SALE</div>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="updated" id="updatedAt">방금 업데이트</div>
    <button class="cartbtn" id="cartBtn" aria-label="장바구니 열기">
      🛒<span class="cartbadge" id="cartBadge">0</span>
    </button>
  </div>
</div>

<div class="brandtabs" id="brandTabs"></div>

<div class="filterrow">
  <div class="seasonpills" id="seasonPills"></div>
  <select class="sortselect" id="sortSelect"></select>
</div>

<div class="hero">
  <h1>오프라인 매장 전용 세일 카탈로그</h1>
  <p>지금 <span class="count" id="itemCount">0</span>개 품목 진행중 — 가격은 매일 바뀔 수 있어요</p>
</div>

<div class="grid" id="grid"></div>

<div class="footer">WEWANT (디티엠 · 수프 · 파프리카 · 페이지) · 거래처 전용 페이지입니다</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* 실제 데이터는 항상 구글시트에서 불러온다(아래 loadFromSheets). 더미/예시 데이터는
   화면이 깜빡이듯 보이는 문제가 있어서 완전히 없앴고, 불러오는 동안은 로딩 문구만 보인다. */
let PRODUCTS = [];
let isLoading = true;
const BRANDS = [
  { key:'all', label:'전체' },
  { key:'dtm', label:'디티엠' },
  { key:'soup', label:'수프' },
  { key:'paprika', label:'파프리카' },
  { key:'page', label:'페이지' }
];

const SEASONS = [
  { key:'all', label:'전체' },
  { key:'springfall', label:'봄/가을' },
  { key:'summer', label:'여름' },
  { key:'winter', label:'겨울' }
];

const SORTS = [
  { key:'stock_desc', label:'재고 많은순' },
  { key:'price_asc', label:'낮은 가격순' },
  { key:'discount_desc', label:'할인율 높은순' }
];

let activeBrand = 'all';
let activeSeason = 'all';
let activeSort = 'stock_desc';
let cart = {}; // key: `${productId}__${colorName}` -> { productId, colorName, qty }

/* 구글시트 "설정" 탭에서 읽어올 문구 템플릿. 시트 연동 전/실패 시에도 동작하도록
   기본값을 같이 둔다. {brand}/{lines}/{total}/{name}/{color}/{qty} 자리를 치환한다. */
let SETTINGS = {
  orderTemplate: '[{brand} 주문]\n{lines}\n\n총 {total}장',
  lineTemplate: '{name} ({color}) x{qty}',
  toastTemplate: '주문 정보가 복사되었습니다! {brand} 카톡으로 붙여넣기 해주세요 :D'
};

function fillTemplate(tpl, vars){
  return tpl.replace(/\{(\w+)\}/g, (m,k)=> (k in vars) ? vars[k] : m);
}

function won(n){ return n.toLocaleString('ko-KR')+'원'; }
function pct(price, sale){ return Math.round((1-sale/price)*100); }

function renderTabs(){
  const wrap = document.getElementById('brandTabs');
  wrap.innerHTML = BRANDS.map(b=>
    `<button class="brandtab${b.key===activeBrand?' active':''}" data-brand="${b.key}">${b.label}</button>`
  ).join('');
  wrap.querySelectorAll('.brandtab').forEach(btn=>{
    btn.onclick = ()=>{ activeBrand = btn.dataset.brand; renderTabs(); renderGrid(); };
  });
}

function renderSeasonPills(){
  const wrap = document.getElementById('seasonPills');
  wrap.innerHTML = SEASONS.map(s=>
    `<button class="seasonpill${s.key===activeSeason?' active':''}" data-season="${s.key}">${s.label}</button>`
  ).join('');
  wrap.querySelectorAll('.seasonpill').forEach(btn=>{
    btn.onclick = ()=>{ activeSeason = btn.dataset.season; renderSeasonPills(); renderGrid(); };
  });
}

function renderSortSelect(){
  const sel = document.getElementById('sortSelect');
  sel.innerHTML = SORTS.map(s=> `<option value="${s.key}" ${s.key===activeSort?'selected':''}>${s.label}</option>`).join('');
  sel.onchange = (e)=>{ activeSort = e.target.value; renderGrid(); };
}

function totalStock(p){ return p.colors.reduce((sum,c)=> sum+c.stock, 0); }

function colorsSummary(colors){
  return colors.map(c=> c.stock>0 ? `${c.name}(${c.stock})` : `<span style="text-decoration:line-through;opacity:.5;">${c.name}</span>`).join(' · ');
}

function sortList(list){
  const arr = list.slice();
  if(activeSort==='price_asc') arr.sort((a,b)=> a.salePrice-b.salePrice);
  else if(activeSort==='stock_desc') arr.sort((a,b)=> totalStock(b)-totalStock(a));
  else if(activeSort==='discount_desc') arr.sort((a,b)=> pct(b.price,b.salePrice)-pct(a.price,a.salePrice));
  return arr;
}

function renderGrid(){
  let list = activeBrand==='all' ? PRODUCTS : PRODUCTS.filter(p=>p.brand===activeBrand);
  if(activeSeason!=='all') list = list.filter(p=>p.season===activeSeason);
  list = sortList(list);
  document.getElementById('itemCount').textContent = list.length;
  const grid = document.getElementById('grid');
  if(!list.length){
    grid.innerHTML = isLoading
      ? '<div class="empty" style="grid-column:1/-1;">상품을 불러오는 중이에요...</div>'
      : '<div class="empty" style="grid-column:1/-1;">조건에 맞는 품목이 없어요</div>';
    return;
  }
  grid.innerHTML = list.map(p=>`
    <div class="card" data-id="${p.id}">
      <div class="photo">
        <span class="badge">SALE</span>
        <span class="pct">${pct(p.price,p.salePrice)}%</span>
        <img src="${p.imgs[0].url}" alt="${p.name}" loading="lazy">
        ${p.imgs.length>1?`<span class="photocount"><i>⛶</i>${p.imgs.length}</span>`:''}
      </div>
      <div class="body">
        <p class="name">${p.name}</p>
        <div class="priceline">
          <span class="old">${won(p.price)}</span>
          <span class="new">${won(p.salePrice)}</span>
        </div>
        <p class="colors">${colorsSummary(p.colors)}</p>
      </div>
    </div>`).join('');
  grid.querySelectorAll('.card').forEach(card=>{
    card.onclick = ()=> openDetail(card.dataset.id);
  });
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove('show'), 2600);
}

function cartKey(pid, colorName){ return `${pid}__${colorName}`; }

function updateCartBadge(){
  const total = Object.values(cart).reduce((s,c)=> s+c.qty, 0);
  const badge = document.getElementById('cartBadge');
  badge.textContent = total;
  badge.classList.toggle('zero', total===0);
}

function openDetail(id){
  const p = PRODUCTS.find(x=> String(x.id) === String(id));
  if(!p) return;
  document.getElementById('sheet').classList.remove('cartsheet');
  const slidesHTML = p.imgs.map(img=>`
    <div class="slide">
      <img src="${img.url}" alt="${p.name}">
      ${img.colorLabel ? `<div class="slidecolorlabel">${img.colorLabel.replace(/</g,'&lt;')}</div>` : ''}
    </div>`).join('');
  const dotsHTML = p.imgs.map((_,i)=>`<span class="dot${i===0?' active':''}" data-i="${i}"></span>`).join('');
  const navHTML = p.imgs.length>1 ? `
    <button class="navbtn prev" aria-label="이전 사진">‹</button>
    <button class="navbtn next" aria-label="다음 사진">›</button>
    <div class="dots">${dotsHTML}</div>` : '';
  const colorChipsHTML = p.colors.map(c=>
    `<span class="colorchip${c.stock<=0?' out':''}">${c.name} ${c.stock>0?c.stock+'개':'품절'}</span>`
  ).join('');
  const firstAvailable = p.colors.find(c=>c.stock>0);
  let selectedColor = firstAvailable ? firstAvailable.name : null;
  let qty = 1;

  const colorPickHTML = p.colors.map(c=>
    `<button class="colorpickchip${c.stock<=0?' disabled':(c.name===selectedColor?' sel':'')}" data-color="${c.name}" ${c.stock<=0?'disabled':''}>${c.name}</button>`
  ).join('');

  document.getElementById('sheet').innerHTML = `
    <div class="closebar"><button onclick="closeDetail()">✕</button></div>
    <div class="dphoto" id="dphoto">
      <div class="slides" id="slides">${slidesHTML}</div>
      ${navHTML}
    </div>
    <div class="dbody">
      <p class="dname">${p.name}</p>
      <div class="dpriceline">
        <span class="dold">${won(p.price)}</span>
        <span class="dnew">${won(p.salePrice)}</span>
      </div>
      <div class="specs">
        <div class="specrow"><span class="speclabel">브랜드</span><span class="specval">${p.brandName}</span></div>
        <div class="specrow"><span class="speclabel">컬러</span><span class="specval"><span class="colorchips">${colorChipsHTML}</span></span></div>
        <div class="specrow"><span class="speclabel">사이즈</span><span class="specval">${p.size}</span></div>
        <div class="specrow"><span class="speclabel">혼용률</span><span class="specval">${p.blend}</span></div>
      </div>
      <div class="desc">${p.desc}</div>

      <div class="specrow" style="margin-top:16px;"><span class="speclabel">담을 컬러</span>
        <span class="specval"><span class="colorpick" id="colorPick">${colorPickHTML}</span></span></div>

      <div class="qtyrow">
        <div class="qtystepper">
          <button id="qtyMinus">−</button>
          <input type="number" class="qtyval" id="qtyVal" value="1" min="1" inputmode="numeric">
          <button id="qtyPlus">+</button>
        </div>
        <span class="qtystock" id="qtyStock"></span>
      </div>

      <button class="addcartbtn" id="addCartBtn">장바구니에 담기</button>
    </div>`;
  document.getElementById('overlay').classList.add('open');

  if(p.imgs.length>1) initSlider(p.imgs.length);

  const colorPickEl = document.getElementById('colorPick');
  const qtyValEl = document.getElementById('qtyVal');
  const qtyStockEl = document.getElementById('qtyStock');
  const addBtn = document.getElementById('addCartBtn');

  function currentStock(){
    const c = p.colors.find(x=>x.name===selectedColor);
    return c ? c.stock : 0;
  }
  function refreshQtyUI(){
    qtyValEl.value = qty;
    const stock = currentStock();
    qtyStockEl.textContent = selectedColor ? `재고 ${stock}개` : '';
    addBtn.disabled = !selectedColor || stock<=0;
    addBtn.textContent = !selectedColor ? '품절된 상품입니다' : '장바구니에 담기';
  }
  function setQty(v){
    const stock = currentStock();
    let n = parseInt(v,10);
    if(isNaN(n) || n<1) n = 1;
    if(n>stock){ n = stock; toast(`최대 재고(${stock}개)까지 담을 수 있어요`); }
    qty = n;
    refreshQtyUI();
  }
  colorPickEl.querySelectorAll('.colorpickchip').forEach(chip=>{
    if(chip.disabled) return;
    chip.onclick = ()=>{
      selectedColor = chip.dataset.color;
      qty = 1;
      colorPickEl.querySelectorAll('.colorpickchip').forEach(c=> c.classList.toggle('sel', c===chip));
      refreshQtyUI();
    };
  });
  document.getElementById('qtyMinus').onclick = ()=> setQty(qty-1);
  document.getElementById('qtyPlus').onclick = ()=> setQty(qty+1);
  qtyValEl.addEventListener('input', (e)=> setQty(e.target.value));
  qtyValEl.addEventListener('blur', ()=> refreshQtyUI());
  addBtn.onclick = ()=>{
    if(!selectedColor) return;
    const key = cartKey(p.id, selectedColor);
    const stock = currentStock();
    const existing = cart[key];
    const newQty = Math.min(stock, (existing?existing.qty:0) + qty);
    cart[key] = { productId:p.id, colorName:selectedColor, qty:newQty };
    updateCartBadge();
    toast(`장바구니에 담았어요 — ${p.name} (${selectedColor}) ${qty}장`);
  };
  refreshQtyUI();
}

function initSlider(count){
  const track = document.getElementById('slides');
  const dots = document.querySelectorAll('#dphoto .dot');
  const prevBtn = document.querySelector('#dphoto .navbtn.prev');
  const nextBtn = document.querySelector('#dphoto .navbtn.next');
  let current = 0;
  function goTo(i){
    current = Math.max(0, Math.min(count-1, i));
    track.scrollTo({ left: track.clientWidth*current, behavior:'smooth' });
    dots.forEach((d,idx)=> d.classList.toggle('active', idx===current));
  }
  prevBtn.onclick = ()=> goTo(current-1);
  nextBtn.onclick = ()=> goTo(current+1);
  dots.forEach(d=> d.onclick = ()=> goTo(Number(d.dataset.i)));
  let scrollTimer;
  track.addEventListener('scroll', ()=>{
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(()=>{
      const idx = Math.round(track.scrollLeft/track.clientWidth);
      current = idx;
      dots.forEach((d,i)=> d.classList.toggle('active', i===idx));
    }, 100);
  });
}
function closeDetail(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeDetail();
});

function openCart(){
  const entries = Object.values(cart).filter(c=>c.qty>0);
  const sheet = document.getElementById('sheet');
  sheet.classList.add('cartsheet');
  if(!entries.length){
    sheet.innerHTML = `
      <div class="closebar"><button onclick="closeDetail()">✕</button></div>
      <div class="cartempty">장바구니가 비어있어요.<br>마음에 드는 품목을 담아보세요!</div>`;
    document.getElementById('overlay').classList.add('open');
    return;
  }

  const byBrand = {};
  entries.forEach(e=>{
    const p = PRODUCTS.find(x=> String(x.id) === String(e.productId));
    if(!p) return;
    if(!byBrand[p.brand]) byBrand[p.brand] = { brandName:p.brandName, items:[] };
    byBrand[p.brand].items.push({ product:p, colorName:e.colorName, qty:e.qty });
  });

  const groupsHTML = Object.keys(byBrand).map(brandKey=>{
    const group = byBrand[brandKey];
    const linesHTML = group.items.map(it=>`
      <div class="cartline" data-key="${cartKey(it.product.id,it.colorName)}">
        <img src="${it.product.imgs[0].url}" alt="${it.product.name}">
        <div class="info">
          <p class="iname">${it.product.name}</p>
          <p class="icolor">${it.colorName}</p>
          <div class="irow">
            <div class="qtystepper">
              <button class="cqminus">−</button>
              <input type="number" class="qtyval" value="${it.qty}" min="1" inputmode="numeric">
              <button class="cqplus">+</button>
            </div>
            <button class="removebtn">빼기</button>
          </div>
        </div>
      </div>`).join('');
    const totalQty = group.items.reduce((s,it)=>s+it.qty,0);
    return `
      <div class="cartbrandgroup" data-brand="${brandKey}">
        <div class="cartbrandhead"><h3>${group.brandName} (${totalQty}장)</h3></div>
        ${linesHTML}
        <button class="orderbtn" data-brand="${brandKey}">${group.brandName} 주문하기</button>
      </div>`;
  }).join('');

  sheet.innerHTML = `
    <div class="closebar"><button onclick="closeDetail()">✕</button></div>
    <div class="dbody">${groupsHTML}</div>`;
  document.getElementById('overlay').classList.add('open');

  sheet.querySelectorAll('.cartline').forEach(line=>{
    const key = line.dataset.key;
    line.querySelector('.cqminus').onclick = ()=> changeCartQty(key, -1);
    line.querySelector('.cqplus').onclick = ()=> changeCartQty(key, 1);
    line.querySelector('.qtyval').addEventListener('change', (e)=> setCartQty(key, e.target.value));
    line.querySelector('.removebtn').onclick = ()=> removeFromCart(key);
  });
  sheet.querySelectorAll('.orderbtn').forEach(btn=>{
    btn.onclick = ()=> placeOrder(btn.dataset.brand, byBrand[btn.dataset.brand]);
  });
}

function maxStockFor(productId, colorName){
  const p = PRODUCTS.find(x=> String(x.id) === String(productId));
  const c = p ? p.colors.find(x=>x.name===colorName) : null;
  return c ? c.stock : 0;
}

function changeCartQty(key, delta){
  const entry = cart[key];
  if(!entry) return;
  const max = maxStockFor(entry.productId, entry.colorName);
  entry.qty = Math.max(0, Math.min(max, entry.qty+delta));
  if(entry.qty===0) delete cart[key];
  updateCartBadge();
  openCart();
}

function setCartQty(key, value){
  const entry = cart[key];
  if(!entry) return;
  const max = maxStockFor(entry.productId, entry.colorName);
  let n = parseInt(value,10);
  if(isNaN(n) || n<1) n = 1;
  if(n>max){ n = max; toast(`최대 재고(${max}개)까지 담을 수 있어요`); }
  entry.qty = n;
  updateCartBadge();
  openCart();
}

function removeFromCart(key){
  delete cart[key];
  updateCartBadge();
  openCart();
}

function placeOrder(brandKey, group){
  const lines = group.items.map(it=> fillTemplate(SETTINGS.lineTemplate, {
    name: it.product.name, color: it.colorName, qty: it.qty
  }));
  const totalQty = group.items.reduce((s,it)=>s+it.qty,0);
  const text = fillTemplate(SETTINGS.orderTemplate, {
    brand: group.brandName, lines: lines.join('\n'), total: totalQty
  });
  const finish = ()=>{
    toast(fillTemplate(SETTINGS.toastTemplate, { brand: group.brandName }));
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(finish).catch(()=>{ fallbackCopy(text); finish(); });
  } else {
    fallbackCopy(text); finish();
  }
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

document.getElementById('cartBtn').onclick = openCart;

function setUpdatedAt(updatedText){
  const el = document.getElementById('updatedAt');
  if(updatedText){ el.textContent = updatedText; return; }
  const now = new Date();
  el.textContent =
    now.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'}) + ' ' +
    now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) + ' 업데이트';
}

/* =========================================================
   구글시트 연동
   1) 구글시트에서 파일 > 공유 > 웹에 게시 (탭별로 각각, 형식: CSV)
   2) 거기서 나온 주소를 아래 두 칸에 붙여넣기
   3) "PASTE_" 로 시작하는 placeholder가 남아있으면 연동 전이라 판단하고
      더미 데이터(데모용)를 그대로 보여준다 — 그래서 시트 연동 전에도 화면은 안 깨짐.
========================================================= */
const SHEET_PRODUCTS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vScxgyoA0pWGcza3HaXxhnRq8nMqvpq1S9Gtg6lYl3awkFkUZzh6XqWOEiU5TZTiOldaBaQHJ-V8T_F/pub?gid=626373018&single=true&output=csv';
const SHEET_SETTINGS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vScxgyoA0pWGcza3HaXxhnRq8nMqvpq1S9Gtg6lYl3awkFkUZzh6XqWOEiU5TZTiOldaBaQHJ-V8T_F/pub?gid=1269149667&single=true&output=csv';

function isConfigured(url){ return url && !url.startsWith('PASTE_'); }

/* 쉼표/줄바꿈이 포함된 칸은 구글이 큰따옴표로 감싸서 내려주므로, 그 규칙을 그대로
   처리하는 작은 CSV 파서. 결과: 첫 줄을 헤더로 쓰는 객체 배열. */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c==='"' && next==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){ /* skip */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(v=>v!=='')).map(r=>{
    const obj = {};
    headers.forEach((h,i)=> obj[h] = (r[i]!==undefined ? r[i] : '').trim());
    return obj;
  });
}

async function fetchCSV(url){
  const res = await fetch(url, { cache:'no-store' });
  if(!res.ok) throw new Error('sheet fetch failed: '+res.status);
  return parseCSV(await res.text());
}

/* 시트 한 칸에 "화이트:12,블랙:5,차콜:0" 식으로 적은 컬러를 파싱 */
function parseColors(str){
  return (str||'').split(',').map(s=>s.trim()).filter(Boolean).map(pair=>{
    const [name, stock] = pair.split(':').map(s=>s.trim());
    return { name, stock: parseInt(stock,10)||0 };
  });
}
/* 사진 여러장은 "url1|url2|url3" 처럼 | 로 구분 */
/* 구글드라이브 thumbnail URL은 외부 사이트에서 차단됨.
   lh3.googleusercontent.com/d/FILE_ID 형식으로 변환하면 외부에서도 로드됨. */
function convertDriveUrl(url){
  if(!url) return url;
  const m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m) return 'https://lh3.googleusercontent.com/d/' + m[1];
  return url;
}

function parseImgs(str){
  // 시트에서 URL이 인코딩된 채로 올 수 있어서 먼저 디코딩
  try{ str = decodeURIComponent(str||''); }catch(e){ str = str||''; }
  return str.split('|').map(s=>s.trim()).filter(Boolean).map(part=>{
    const idx = part.indexOf('::');
    if(idx === -1) return { url: convertDriveUrl(part), colorLabel: '' };
    return { url: convertDriveUrl(part.slice(0,idx).trim()), colorLabel: part.slice(idx+2).trim() };
  });
}

function rowToProduct(row, idx){
  return {
    id: row.id || (idx+1),
    brand: row.brand,
    brandName: row.brandName,
    season: row.season,
    name: row.name,
    price: parseInt(row.price,10)||0,
    salePrice: parseInt(row.salePrice,10)||0,
    colors: parseColors(row.colors),
    imgs: parseImgs(row.imgs),
    size: row.size,
    blend: row.blend,
    desc: (row.desc||'').replace(/\\n/g,'\n')
  };
}

async function loadFromSheets(){
  if(isConfigured(SHEET_PRODUCTS_CSV_URL)){
    try{
      const rows = await fetchCSV(SHEET_PRODUCTS_CSV_URL);
      const visible = rows.filter(r=> (r.visible||'O').toUpperCase() !== 'X');
      const products = visible.map(rowToProduct).filter(p=>p.imgs.length && p.name);
      PRODUCTS = products;
      setUpdatedAt(); // 시트 fetch 성공 시각으로 갱신
    }catch(e){
      console.warn('상품 시트 연동 실패', e);
    }
  }
  if(isConfigured(SHEET_SETTINGS_CSV_URL)){
    try{
      const rows = await fetchCSV(SHEET_SETTINGS_CSV_URL);
      rows.forEach(r=>{
        if(r.key && r.value!==undefined) SETTINGS[r.key] = r.value.replace(/\\n/g,'\n');
      });
    }catch(e){
      console.warn('설정 시트 연동 실패, 기본 문구를 사용합니다.', e);
    }
  }
  isLoading = false;
  renderGrid();
}

renderTabs();
renderSeasonPills();
renderSortSelect();
renderGrid();
setUpdatedAt();
updateCartBadge();
loadFromSheets();
</script>
